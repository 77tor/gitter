<!DOCTYPE html>
<html lang="no">
<head>

    <title>Gitter-generator</title>

<style>
    @font-face {
        font-family: 'Trykkskrift';
        src: url('trykkskrift.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }

    :root {
        --vokal-farge: #ffcccc; 
        --vokal-tekst: #e74c3c;
        --konsonant-tekst: #2c3e50;
        --konsonant-overskrift: #2980b9;
        --alt-match: #27ae60;
        --sidebar-bg: #243447; 
        --item-bg: #2c3e50;    
        --accent-green: #27ae60;
        --sidebar-text: #ffffff;
        --main-bg: #d1d8e0; 
    }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        display: flex; 
        height: 100vh; 
        background-color: var(--main-bg); 
        color: #333;
        overflow: hidden; 
    }

    /* SIDEBAR OG LOGO */
    .sidebar {
        width: 350px;
        background-color: var(--sidebar-bg);
        color: var(--sidebar-text);
        padding: 15px 15px 2px 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        z-index: 10;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }

    .sidebar h2 { margin: 0; flex-grow: 1; text-align: center; font-size: 1.1rem; text-transform: uppercase; }

    textarea { 
        width: 100%; 
        height: 95px; 
        padding: 10px; 
        border-radius: 6px; 
        border: none; 
        font-family: inherit; 
        font-size: 0.9rem; 
        box-sizing: border-box; 
        margin-bottom: 15px; 
        background-color: #ecf0f1;
        resize: none;
    }

    .sidebar-controls {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .action-btn:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
    }

    /* KONTROLLER */
    .control-item {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem;
    }

    .control-item select {
        padding: 6px;
        border-radius: 4px;
        border: none;
        background: #ecf0f1;
        font-family: inherit;
        font-size: 0.85rem;
        width: 60%;
        cursor: pointer;
    }

    .switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #27ae60; }
    input:checked + .slider:before { transform: translateX(20px); }

    .action-btn { 
        width: 100%; 
        padding: 10px; 
        border-radius: 8px; 
        border: none; 
        font-weight: 600; 
        cursor: pointer; 
        margin-bottom: 0; 
        color: white; 
        transition: 0.2s;
        box-sizing: border-box; 
        font-size: 0.85rem;
        display: flex;         
        align-items: center;   
        justify-content: center; 
    }

    .btn-generate { background-color: var(--accent-green); color: white; }
    .btn-row { display: flex; gap: 8px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; margin-top: auto; }

    /* HOVEDOMRÅDE OG SKALERING AV A4-ARKET PÅ SKJERM */
/* HOVEDOMRÅDE: Lager et stabilt vindu som lar innholdet rulle fritt */
    .main-content { 
        flex-grow: 1; 
        overflow: auto; 
        display: flex; 
        justify-content: center; 
        align-items: flex-start; 
        padding: 40px 20px; 
        box-sizing: border-box;
        height: 100vh; /* Holder seg trygt innenfor nettleservinduet */
    }
    
    /* PREVIEW-ARKET: Her bestemmer vi størrelsen direkte */
#capture-area { 
        background: #ffffff !important; 
        width: 210mm;         
        height: 297mm;    
        padding: 30mm 20mm;   
        box-sizing: border-box;
        display: flex; 
        flex-direction: column;
        align-items: center;  
        box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
        position: relative; 
        flex-shrink: 0;
        
        /* ØKT STØRRELSE: Satt til 0.68 (68% størrelse) */
        transform: scale(0.68); 
        transform-origin: top center; 
        
        /* JUSTERT MARGIN: Siden arket er større, krymper vi det usynlige tomrommet til -300px */
        margin-top: 10px;
        margin-bottom: -300px; 
    }


    .table-container { 
        display: flex; 
        align-items: flex-start; 
        gap: 20px; 
        position: relative; 
        z-index: 6; 
        margin-top: 40px; 
    }
    
    .row-numbers { display: flex; flex-direction: column; padding-top: 55px; }
    .num-item { height: 42px; display: flex; align-items: center; justify-content: flex-end; width: 30px; padding-right: 10px; font-style: italic; font-size: 0.9rem; color: #7f8c8d; }

    table { border-collapse: collapse; }
    td, .word-list-box { font-family: 'Trykkskrift', sans-serif; }

    td { 
        border: 1px solid #000 !important; 
        width: 42px; 
        height: 42px; 
        text-align: center; 
        font-size: 1.3rem; 
        position: relative;
        background-color: white !important;
    }

    body.show-vowel-bg .is-vowel-cell { background-color: var(--vokal-farge) !important; }
    body:not(.hide-ends-active) .inactive { background-color: #d1d1d1 !important; }
    body.hide-ends-active .inactive { background-color: white !important; }
    body.hide-ends-active.show-vowel-bg .is-vowel-cell { background-color: var(--vokal-farge) !important; }

    .header-row td { border: 2px solid #000 !important; height: 48px; }
    .v-text { color: var(--vokal-tekst); }
    .k-text { color: var(--konsonant-tekst); }
    .header-row .k-text { color: var(--konsonant-overskrift); }

    body.uppercase-mode td, body.uppercase-mode .word-list-box { text-transform: uppercase; }
    .cell-content { display: none; }
    .show-fasit .cell-content { display: block; }

    /* ORDLISTE */
    .word-list-box { 
        border: 2px solid #333; 
        padding: 15px; 
        margin-top: 30px; 
        background: white; 
        width: 100%; 
        box-sizing: border-box; 
        display: block; 
        min-width: 100%; 
        max-width: 0; 
    }

    .word-list-box h3 { 
        margin: 0 0 10px 0; 
        text-align: center; 
        border-bottom: 2px solid #333; 
        padding-bottom: 5px; 
    }

    .word-list-box ul {  
        list-style: none; 
        padding: 0; 
        margin: 0;
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        gap: 10px 20px; 
    }

    .word-list-box li { 
        padding: 2px 0; 
        border: none; 
        white-space: nowrap; 
    }

    .alt-indicator { display: none; position: absolute; top: 1px; right: 1px; color: var(--alt-match); font-size: 0.5rem; }
    .show-fasit .alt-indicator { display: block; }
    .show-fasit .is-alt-start { outline: 2px dashed var(--alt-match); outline-offset: -4px; }

    /* HAMBURGER MENY */
    .menu-container { position: relative; margin-bottom: 0; margin-right: 15px; }
    .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; width: 20px; padding: 5px; }
    .hamburger span { display: block; width: 100%; height: 2px; background-color: white; border-radius: 1px; transition: 0.3s; }

    .dropdown-menu {
        display: none;
        position: absolute;
        top: 25px;
        left: 0;
        background-color: #2c3e50;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        width: 200px;
        z-index: 100;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.5);

    .dropdown-menu.show { display: block !important; }

    .menu-icon { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; object-fit: contain; border-radius: 3px; }
    .dropdown-menu a { display: block; color: white; padding: 12px 15px; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .menu-item-disabled { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }

/* ==========================================================================
       UTSKRIFT: LÅSER RAMMEN DIREKTE TIL YTTERKANTEN AV A4
       ========================================================================== */
    @media print {
        @page {
            size: A4 portrait;
            margin: 8mm !important; 
        }
        
        html, body {
            background-color: #ffffff !important;
            height: 100% !important;
            overflow: hidden !important;
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important;
        }

            background-color: #ffffff !important; 
            padding: 0 !important; 
            margin: 0 !important;
            display: block !important; 
            overflow: hidden !important;
            height: auto !important; /* Endret fra 100% til auto */

            width: 100% !important;

            page-break-after: avoid !important;
            
            /* SIKRER NULLSTILLING AV SKJERM-MARGINENE: */

            print-color-adjust: exact !important;
        }

            <label class="switch"><input type="checkbox" id="toggleEnds" onchange="updateView()"><span class="slider"></span></label>
        </div>
        <div class="control-item">
            <span>Vokal-farge</span>
            <label class="switch"><input type="checkbox" id="toggleVowels" onchange="updateView()"><span class="slider"></span></label>
        </div>
        <div class="control-item">
            <span>STORE bokstaver</span>
            <label class="switch"><input type="checkbox" id="toggleCase" onchange="updateView()"><span class="slider"></span></label>
        </div>
        <div class="control-item">
            <span style="color: #ff7675;">Vis fasit</span>
            <label class="switch"><input type="checkbox" id="toggleFasit" onchange="updateView()"><span class="slider"></span></label>
        </div>
        
        <div class="control-item">
            <span>Visuelt tema</span>
            <select id="temaVelger" onchange="oppdaterTema()">
                <option value="tema-standard">Standard (Blå/Grå)</option>
                <option value="theme-logo">Standard (med logo)</option>
                <option value="tema-skog">Skog og Natur (Grønn)</option>
                <option value="tema-sol">Solskinn (Gul/Oransje)</option>
                <option value="tema-minimal">Minimalistisk (Svart/Hvit)</option>
                <option value="theme-host">🍂 Høst</option>
                <option value="theme-vinter">❄️ Vinter</option>
                <option value="theme-sommer">🌸 Sommer</option>
                <option value="theme-rommet">🚀 Verdensrommet</option>
                <option value="theme-fest">🎈 Fest / Bursdag</option>
                <option value="theme-racerbil">🏎️ Racerbil</option>
                <option value="theme-kryp">🐞 Småkryp</option>
                <option value="theme-sommerfugl">🦋 Sommerfugler</option>
                <option value="theme-halloween">🎃 Halloween</option>
                <option value="theme-jul">🎄 Jul</option>
                <option value="theme-dino">🦖 Dinosaurer</option>
                <option value="theme-pirat">🏴‍☠️ Sjørøvere</option>
                <option value="theme-sport">⚽️ Sport / Aktivitet</option>
            </select>
        </div>
<div class="control-item">
    <span>Overskrift</span>
    <input type="text" id="titleInput" class="title-input" placeholder="Gitteroppgave" oninput="oppdaterOverskrift()">
</div>

        <div class="btn-group">
            <button class="action-btn btn-generate" onclick="generate()" style="flex: 2; white-space: nowrap;">LAG GITTER</button>
            <button class="action-btn" onclick="resetForm()" style="flex: 1; white-space: nowrap; background-color: #ff7675;">NULLSTILL</button>
        </div>

        <div class="btn-row">
            <button class="action-btn" style="flex: 1; background-color: #2980b9;" onclick="window.print()">SKRIV UT</button>
            <button class="action-btn" style="flex: 1; background-color: #9b59b6;" onclick="downloadFullImage()">LAST NED BILDE</button>
        </div>
    </div>
</div>

<div class="main-content">
    <div id="placeholder-image" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
        <img src="gitter_03.png" alt="Velkomstbilde" style="max-width: 400px; opacity: 0.3; filter: grayscale(100%);">
    </div>

    <div id="capture-area" style="display: none;">
        <div id="theme-img-1" class="theme-image"></div>
        <div id="theme-img-2" class="theme-image"></div>
        <div id="theme-img-3" class="theme-image"></div>

        <h1 id="pageTitle" class="page-title">Gitteroppgave</h1>

        <div class="table-container">
            <div id="numberColumn" class="row-numbers"></div>
            <div style="display: table;">
                <div id="gridOutput"></div>
                <div id="wordListOutput"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const vokaler = "aeiouyæøå";

    function updateView() {
        const body = document.body;
        if (!document.getElementById('toggleEnds').checked) body.classList.add('hide-ends-active');
        else body.classList.remove('hide-ends-active');
        if (document.getElementById('toggleVowels').checked) body.classList.add('show-vowel-bg');
        else body.classList.remove('show-vowel-bg');
        if (document.getElementById('toggleFasit').checked) body.classList.add('show-fasit');
        else body.classList.remove('show-fasit');
        if (document.getElementById('toggleCase').checked) body.classList.add('uppercase-mode');
        else body.classList.remove('uppercase-mode');
    }

    function oppdaterTema() {
        const body = document.body;
        const ark = document.getElementById('capture-area');
        const temaVelger = document.getElementById('temaVelger');
        if (!ark || !temaVelger) return;

        const alleTemaer = [
            'tema-standard', 'theme-logo', 'tema-skog', 'tema-sol', 'tema-minimal', 
            'theme-host', 'theme-vinter', 'theme-sommer', 
            'theme-rommet', 'theme-fest', 'theme-racerbil', 'theme-kryp', 'theme-sommerfugl', 'theme-halloween', 
            'theme-jul', 'theme-dino', 'theme-pirat', 'theme-sport'
        ];
        
        body.classList.remove(...alleTemaer);
        body.classList.add(temaVelger.value);
    }

// Funksjon som oppdaterer overskriften dynamisk når du skriver
function oppdaterOverskrift() {
    const inputFelt = document.getElementById('titleInput');
    const arkTittel = document.getElementById('pageTitle');
    if (inputFelt.value.trim() === "") {
        arkTittel.textContent = "Gitteroppgave";
    } else {
        arkTittel.textContent = inputFelt.value;
    }
}

    function resetForm() {
        if(!confirm("Nullstille alt?")) return;
        document.getElementById('wordInput').value = "";
        document.getElementById('gridOutput').innerHTML = "";
        document.getElementById('numberColumn').innerHTML = "";
        document.getElementById('wordListOutput').innerHTML = "";
        document.getElementById('placeholder-image').style.display = 'flex';
        document.getElementById('capture-area').style.display = 'none';
        document.querySelectorAll('input[type=checkbox]').forEach(el => el.checked = false);
        document.getElementById('temaVelger').value = 'tema-standard';
        document.getElementById('titleInput').value = ""; 
        document.getElementById('pageTitle').textContent = "Gitteroppgave";
        oppdaterTema();
        updateView();
    }

    function getPattern(word) {
        return word.toLowerCase().split('').map(c => vokaler.includes(c) ? 'V' : 'K');
    }

    function buildMaster(wordData) {
        let master = [...wordData[0].pattern];
        let placements = [{ start: 0, length: wordData[0].pattern.length }];
        for (let i = 1; i < wordData.length; i++) {
            let p = wordData[i].pattern;
            let minNewLength = Infinity;
            let finalShift = 0;
            for (let s = -p.length; s <= master.length; s++) {
                let possibleMatch = true;
                for (let j = 0; j < p.length; j++) {
                    let mIdx = s + j;
                    if (mIdx >= 0 && mIdx < master.length) {
                        if (master[mIdx] !== p[j]) { possibleMatch = false; break; }
                    }
                }
                if (possibleMatch) {
                    let currentStart = Math.min(0, s);
                    let currentEnd = Math.max(master.length, s + p.length);
                    let totalLen = currentEnd - currentStart;
                    if (totalLen < minNewLength) { minNewLength = totalLen; finalShift = s; }
                }
            }
            let newMaster = [];
            let offset = finalShift < 0 ? Math.abs(finalShift) : 0;
            if (finalShift < 0) {
                placements.forEach(pl => pl.start += offset);
                for(let k=0; k<offset; k++) newMaster.push(p[k]);
                master.forEach(m => newMaster.push(m));
                finalShift = 0;
            } else { newMaster = [...master]; }
            for (let j = 0; j < p.length; j++) newMaster[finalShift + j] = p[j];
            master = newMaster;
            placements.push({ start: finalShift, length: p.length });
        }
        return { master, placements };
    }

    function generate() {
        const input = document.getElementById('wordInput').value.trim();
        if (input.length === 0) return;

        document.getElementById('placeholder-image').style.display = 'none';
        document.getElementById('capture-area').style.display = 'flex'; 

        const rawWords = input.split(/[\s,]+/).map(w => w.trim()).filter(w => w !== "");
        if (rawWords.length === 0) return;

        let wordData = rawWords.map(w => ({ word: w, pattern: getPattern(w) }));
        wordData.sort((a, b) => b.word.length - a.word.length);

        const result = buildMaster(wordData);
        const masterPattern = result.master;
        const maxLength = masterPattern.length;

        const numCol = document.getElementById('numberColumn');
        numCol.innerHTML = wordData.map((_, i) => `<div class="num-item">${i + 1}.</div>`).join('');

        let table = document.createElement('table');
        let headerRow = document.createElement('tr');
        headerRow.className = "header-row";
        masterPattern.forEach(char => {
            let td = document.createElement('td');
            if (char === 'V') td.classList.add('is-vowel-cell');
            td.innerHTML = `<span class="${char === 'V' ? 'v-text' : 'k-text'}">${char}</span>`;
            headerRow.appendChild(td);
        });
        table.appendChild(headerRow);

        wordData.forEach((data, idx) => {
            let row = document.createElement('tr');
            let letters = data.word.split('');
            let pos = result.placements[idx];
            let altStarts = [];
            for (let s = 0; s <= maxLength - data.pattern.length; s++) {
                let match = true;
                for (let j = 0; j < data.pattern.length; j++) {
                    if (masterPattern[s+j] !== data.pattern[j]) { match = false; break; }
                }
                if (match && s !== pos.start) altStarts.push(s);
            }
            for (let i = 0; i < maxLength; i++) {
                let td = document.createElement('td');
                if (masterPattern[i] === 'V') td.classList.add('is-vowel-cell');
                if (i >= pos.start && i < pos.start + pos.length) {
                    td.innerHTML = `<span class="cell-content">${letters[i - pos.start]}</span>`;
                } else { td.classList.add('inactive'); }
                if (altStarts.includes(i)) {
                    td.classList.add('is-alt-start');
                    td.innerHTML += `<span class="alt-indicator">ALT</span>`;
                }
                row.appendChild(td);
            }
            table.appendChild(row);
        });

        document.getElementById('gridOutput').innerHTML = "";
        document.getElementById('gridOutput').appendChild(table);
        const sorted = [...rawWords].sort((a,b) => a.localeCompare(b, 'nb'));
        document.getElementById('wordListOutput').innerHTML = `<div class="word-list-box"><h3>Ordliste</h3><ul>${sorted.map(w => `<li>${w}</li>`).join('')}</ul></div>`;
        updateView();
    }

    function downloadFullImage() {
        const element = document.getElementById('capture-area');
        if (!element || document.getElementById('gridOutput').innerHTML === "") {
            alert("Generer et gitter først!");
            return;
        }
        
        const originalTransform = element.style.transform;
        element.style.transform = "none";

        html2canvas(element, {
            backgroundColor: "#ffffff",
            scale: 2,
            onclone: (clonedDoc) => {
                const area = clonedDoc.getElementById('capture-area');
                area.style.display = "flex";
                area.style.boxShadow = "none";
                area.style.transform = "none";
            }
        }).then(canvas => {
            element.style.transform = originalTransform; 
            const link = document.createElement('a');
            link.download = 'gitter_oppgave.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function toggleMenu() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest('.menu-container')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
    
    updateView();
</script>
</body>
</html>
