<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Gitter-generator</title>
    <link rel="icon" type="image/png" href="gitter_01.png">
    <link rel="apple-touch-icon" href="gitter_01.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    @font-face {
        font-family: 'Trykkskrift';
        src: url('trykkskrift.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }

    :root {
        --vokal-farge: #ffcccc; 
        --vokal-tekst: #e74c3c;
        --konsonant-tekst: #2c3e50;
        --konsonant-overskrift: #2980b9;
        --alt-match: #27ae60;
        --sidebar-bg: #243447; 
        --item-bg: #2c3e50;    
        --accent-green: #27ae60;
        --sidebar-text: #ffffff;
        --main-bg: #d1d8e0; 
        --cell-size: 42px; /* Standard (middels) størrelse */
    }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        display: flex; 
        height: 100vh; 
        background-color: var(--main-bg); 
        color: #333;
        overflow: hidden; 
    }

    /* SIDEBAR OG LOGO */
    .sidebar {
        width: 350px;
        background-color: var(--sidebar-bg);
        color: var(--sidebar-text);
        padding: 15px 15px 2px 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        z-index: 10;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }

    .sidebar h2 { margin: 0; flex-grow: 1; text-align: center; font-size: 1.1rem; text-transform: uppercase; }

    textarea { 
        width: 100%; 
        height: 95px; 
        padding: 10px; 
        border-radius: 6px; 
        border: none; 
        font-family: inherit; 
        font-size: 0.9rem; 
        box-sizing: border-box; 
        margin-bottom: 15px; 
        background-color: #ecf0f1;
        resize: none;
    }

    .sidebar-controls {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .action-btn:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
    }

    /* KONTROLLER */
    .control-item {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem;
    }

    .control-item select {
        padding: 6px;
        border-radius: 4px;
        border: none;
        background: #ecf0f1;
        font-family: inherit;
        font-size: 0.85rem;
        width: 60%;
        cursor: pointer;
    }

    .switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #27ae60; }
    input:checked + .slider:before { transform: translateX(20px); }

    .action-btn { 
        width: 100%; 
        padding: 10px; 
        border-radius: 8px; 
        border: none; 
        font-weight: 600; 
        cursor: pointer; 
        margin-bottom: 0; 
        color: white; 
        transition: 0.2s;
        box-sizing: border-box; 
        font-size: 0.85rem;
        display: flex;              
        align-items: center;   
        justify-content: center; 
    }

    .btn-generate { background-color: var(--accent-green); color: white; }
    .btn-row { display: flex; gap: 8px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; margin-top: auto; }

/* ==========================================================================
   HOVEDOMRÅDE: PLASSERER ARKET HØYT OG GODT PÅ SKJERMEN
   ========================================================================== */
.main-content { 
    flex-grow: 1; 
    overflow: hidden;    
    display: flex; 
    justify-content: center; 
    align-items: flex-start; /* Sørger for at det starter øverst */
    padding: 20px; 
    box-sizing: border-box;
    height: 100vh;       
    background-color: var(--main-bg); 
}

#capture-area { 
    background: #ffffff !important; 
    width: 210mm;         
    height: 297mm;        
    padding: 20mm 18mm !important; 
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column;
    align-items: center;  
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
    
    /* DENNE LINJEN ER LIVSVIKTIG FOR AT BILDENE SKAL VISES INNE PÅ ARKET: */
    position: relative !important; 
    
    flex-shrink: 0;
    margin: 30px auto 0 auto; 

    /* Skalerer ned arket nydelig på skjermen */
    transform: scale(0.75); 
    transform-origin: top center; 
}

    /* Fellesregel som posisjonerer temalinjen nøyaktig der den skrives ut */
    #capture-area::after {
        content: "";
        position: absolute;
        top: 10mm;    
        left: 10mm;   
        right: 10mm;  
        bottom: 10mm; 
        pointer-events: none; 
        z-index: 1;
        box-sizing: border-box;
    }

    .vowel-box {
        margin-top: 15px;
        padding: 10px 15px;
        border: 1px solid #7f8c8d;
        border-radius: 4px;
        background-color: #fcfcfc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1rem;
        color: #2c3e50;
        width: fit-content;
        max-width: 100%;
        box-sizing: border-box;
    }

    .vowel-title {
        font-weight: bold;
        margin-right: 8px;
    }

    .vowel-list {
        letter-spacing: 5px; 
        font-weight: 600;
        color: #e74c3c; 
    }

    .row-numbers { 
        display: none; 
    }

    .num-cell {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        font-style: italic;
        font-size: 0.9rem;
        color: #7f8c8d;
        text-align: right !important;
        padding-right: 4px !important;
        border: none !important; 
        background: transparent !important;
        width: 18px !important;
        white-space: nowrap;
        height: calc(var(--cell-size) * 1.20) !important;
    }

    .header-row td.num-cell-blank, 
    .num-cell-blank {
        border: none !important;
        border-color: transparent !important;
        outline: none !important;
        background: transparent !important;
        background-color: transparent !important;
        width: 18px !important;
    }

    table { border-collapse: collapse; }
    td, .word-list-box, .vowel-line { font-family: 'Trykkskrift', sans-serif; }

    td { 
        border: 1px solid #000 !important; 
        width: var(--cell-size) !important; 
        height: calc(var(--cell-size) * 1.20) !important; 
        text-align: center; 
        font-size: calc(var(--cell-size) * 0.45); 
        position: relative;
        background-color: white !important;
    }

    body.show-vowel-bg .is-vowel-cell { background-color: var(--vokal-farge) !important; }
    body:not(.hide-ends-active) .inactive { background-color: #d1d1d1 !important; }
    body.hide-ends-active .inactive { background-color: white !important; }
    body.hide-ends-active.show-vowel-bg .is-vowel-cell { background-color: var(--vokal-farge) !important; }

    .header-row td { 
        border: 2px solid #000 !important; 
        height: calc(var(--cell-size) * 1.15) !important; 
    }
    .v-text { color: var(--vokal-tekst); }
    .k-text { color: var(--konsonant-tekst); }
    .header-row .k-text { color: var(--konsonant-overskrift); }

    body.uppercase-mode td, body.uppercase-mode .word-list-box, body.uppercase-mode .vowel-line { text-transform: uppercase; }
    .cell-content { display: none; }
    .show-fasit .cell-content { display: block; }

/* ORDLISTE */
.word-list-box { 
    padding: 2px; 
    margin-top: 30px; 
    background: white; 
    width: 100%; 
    box-sizing: border-box; 
    display: block; 
    min-width: 100%; 
    max-width: 100%; 
}

.word-list-box h3 { 
    margin: 0 0 10px 0; 
    text-align: center; 
    border-bottom: 2px solid #333; 
    padding-bottom: 5px; 
}

.word-list-box ul {  
    list-style: none; 
    padding: 0 !important; 
    margin: 0 !important;
    display: flex; 
    flex-wrap: wrap; 
    width: 100% !important; 
    
    /* FIX 1: Bytt til center! Dette samler linje 2 pent på midten */
    justify-content: center; 
    
    /* Hold på det tette mellomrommet som gir perfekt linje 1 */
    gap: 10px 8px; 
}

.word-list-box ul li { 
    padding: 2px 0; 
    border: none; 
    white-space: nowrap; 
    font-family: 'Trykkskrift', sans-serif;
    font-size: 1.5rem; 
    font-weight: 500;
    text-align: center;
    
    /* FIX 2: Vi bruker flex: 1 for å tvinge ordene til å fylle linje 1 helt ut,
       MEN setter en max-width slik at ordene på linje 2 ikke kan blåse seg opp! */
    flex: 1;
    max-width: fit-content;
}

/* DEN MAGISKE LØSNINGEN FOR LINJE 2:
   Dette elementet er usynlig, men støvsuger til seg alt overflødig tomrom på den siste linjen */
.word-list-box ul li.filler-space {
    flex-grow: 999; /* Tar alt tomrommet */
    max-width: none !important;
    padding: 0;
    margin: 0;
    height: 0;
}

    .alt-indicator { display: none; position: absolute; top: 1px; right: 1px; color: var(--alt-match); font-size: 0.5rem; }
    .show-fasit .alt-indicator { display: block; }
    .show-fasit .is-alt-start { outline: 2px dashed var(--alt-match); outline-offset: -4px; }

    .vowel-line {
        visibility: hidden; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1.1rem;
        width: fit-content;
        margin: 0 auto; 
        padding: 4px 16px; 
        border: 1px solid #7f8c8d;
        border-radius: 6px;
        background-color: #fcfcfc;
        text-align: center;
    }

    body.show-vowel-line-active .vowel-line { 
        visibility: visible !important; 
    }

    #vowelListContent {
        letter-spacing: 2px;
        font-weight: 600;
        color: #e74c3c; 
    }

    /* HAMBURGER MENY */
    .menu-container { position: relative; margin-bottom: 0; margin-right: 15px; }
    .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; width: 20px; padding: 5px; }
    .hamburger span { display: block; width: 100%; height: 2px; background-color: white; border-radius: 1px; transition: 0.3s; }

    .dropdown-menu {
        display: none;
        position: absolute;
        top: 25px;
        left: 0;
        background-color: #2c3e50;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        width: 200px;
        z-index: 100;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
    }
    .dropdown-menu.show { display: block !important; }

    .menu-icon { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; object-fit: contain; border-radius: 3px; }
    .dropdown-menu a { display: block; color: white; padding: 12px 15px; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dropdown-menu a:hover { background-color: #34495e; }
    .menu-item-disabled { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }


/* ==========================================================================
   TEMA CONFIG: KLASSISKE RAMMER LÅST TIL SKJERM OG PRINT ::AFTER
   ========================================================================== */
body.theme-standard .main-content { background-color: #d1d8e0; }
body.theme-standard #capture-area::after { border: 6px solid #2b6cb0 !important; }

body.theme-skog .main-content { background-color: #dbebd7; }
body.theme-skog #capture-area::after { border: 6px solid #2f855a !important; }

body.theme-host #capture-area::after { border: 8px double #d35400 !important; }

body.theme-vinter #capture-area::after { border: 6px dashed #3498db !important; }

body.theme-sommer #capture-area::after { border: 6px solid #f1c40f !important; }

/* TEMA BILDER-INTEGRASJON PLASSERING */

    position: absolute;

/* ==========================================================================
   UTSKRIFT: MATCHES SKJERMVISNINGEN 1:1 (PERFEKT STREKT LINJE 1, MIDTSTILT LINJE 2)
   ========================================================================== */
@media print {
    @page {
        size: A4 portrait;
        margin: 0mm !important; 
    }
    
    html, body {
        background-color: #ffffff !important;
        height: 100% !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important;
    }

    .sidebar { display: none !important; }
    
    .main-content { 
        background-color: #ffffff !important; 
        padding: 0 !important; 
        margin: 0 !important;
        display: flex !important; 
        justify-content: center !important;
        align-items: flex-start !important;
        overflow: hidden !important;
        height: 100vh !important;
        width: 100% !important;
    }
    
    #capture-area { 
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;  
        position: relative !important;
        
        width: 210mm !important;   
        height: 297mm !important;

        box-shadow: none !important; 
        transform: none !important;

    /* DENS ENKLE FIXEN FOR MIDTSTILLING AV RAD 2:
       I stedet for å fylle hele høyre side, tar vi en automatisk margin på venstre side av den tomme plassen.
       Det tvinger tekst-ordene foran til å sentrere seg på den linjen de ligger på! */
    .word-list-box ul::after {
        content: "" !important;

    .word-list-box ul li {
        font-weight: 500 !important;

<script>
    const vokaler = "aeiouyæøå";


function updateView() {
        const body = document.body;
        if (!document.getElementById('toggleEnds').checked) body.classList.add('hide-ends-active');
        else body.classList.remove('hide-ends-active');
        if (document.getElementById('toggleVowels').checked) body.classList.add('show-vowel-bg');
        else body.classList.remove('show-vowel-bg');
        if (document.getElementById('toggleFasit').checked) body.classList.add('show-fasit');
        else body.classList.remove('show-fasit');
        if (document.getElementById('toggleCase').checked) body.classList.add('uppercase-mode');
        else body.classList.remove('uppercase-mode');
        
        // Sjekker bryteren for vokallinjen
        if (document.getElementById('toggleVowelLine').checked) body.classList.add('show-vowel-line-active');
        else body.classList.remove('show-vowel-line-active');

        // Oppdaterer ordlisten umiddelbart når bryteren flippes
        if (document.getElementById('gridOutput').innerHTML !== "") {
            const input = document.getElementById('wordInput').value.trim();
            const rawWords = input.split(/[\s,]+/).map(w => w.trim()).filter(w => w !== "");
            let ordlisteHTML = "";
            
            // NÅ RIKTIG: Sjekker om bryteren er huket av (checked)
            const tommeFeltErMarkert = document.getElementById('toggleEnds').checked;

            if (tommeFeltErMarkert) {
                const tilfeldigeOrd = [...rawWords];
                for (let i = tilfeldigeOrd.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tilfeldigeOrd[i], tilfeldigeOrd[j]] = [tilfeldigeOrd[j], tilfeldigeOrd[i]];
                }
                ordlisteHTML = tilfeldigeOrd.map(w => `<li>${w}</li>`).join('');
            } else {
                ordlisteHTML = rawWords.map((w, idx) => `<li>${idx + 1}. ${w}</li>`).join('');
            }
            document.getElementById('wordListOutput').innerHTML = `
                <div class="word-list-box">
                    <h3>Ordliste</h3>
                    <ul>${ordlisteHTML}</ul>
                </div>
            `;
        }
    }

function sjekkOverlappMedBilde() {
    const ordliste = document.querySelector('.word-list-box');
    const bilde3 = document.getElementById('theme-img-3');
    const captureArea = document.getElementById('capture-area');

    if (ordliste && bilde3 && captureArea) {
        // Nullstill display først så vi får korrekte høydemål
        bilde3.style.display = ''; 
        
        // Finn ut nøyaktig hvor mange piksler ned på arket ordlisten slutter
        const captureTop = captureArea.getBoundingClientRect().top;
        const ordlisteMål = ordliste.getBoundingClientRect();
        const bildeMål = bilde3.getBoundingClientRect();
        
        const ordlisteBunnPosisjon = ordlisteMål.bottom - captureTop;
        const bildeToppPosisjon = bildeMål.top - captureTop;

        // Sikkerhetssone: Hvis bunnen av ordlisten er mindre enn 20 piksler 
        // unna toppen av bildet (eller har gått forbi det), skjuler vi det.
        if (ordlisteBunnPosisjon >= (bildeToppPosisjon - 20)) {
            bilde3.style.setProperty('display', 'none', 'important');
            console.log("Kollisjon oppdaget! Skjuler bilde 3.");
        }
    }
}

    function oppdaterTema() {
        const body = document.body;
        const ark = document.getElementById('capture-area');
        const temaVelger = document.getElementById('temaVelger');
        if (!ark || !temaVelger) return;

        const alleTemaer = [
            'theme-standard', 'theme-skog', 'theme-sol', 'theme-minimal', 
            'theme-host', 'theme-vinter', 'theme-sommer', 
            'theme-rommet', 'theme-fest', 'theme-racerbil', 'theme-kryp', 'theme-sommerfugl', 'theme-halloween', 
            'theme-jul', 'theme-dino', 'theme-pirat', 'theme-sport'
        ];
        
        body.classList.remove(...alleTemaer);
        body.classList.add(temaVelger.value);
    }

    function oppdaterOverskrift() {
        const inputFelt = document.getElementById('titleInput');
        const arkTittel = document.getElementById('pageTitle');
        if (inputFelt.value.trim() === "") {
            arkTittel.textContent = "Gitteroppgave";
        } else {
            arkTittel.textContent = inputFelt.value;
        }
    }


function oppdaterStorrelse() {
    const sizeVelger = document.getElementById('sizeVelger');
    if (sizeVelger) {
        document.documentElement.style.setProperty('--cell-size', sizeVelger.value);
    }
}

function resetForm() {
        if(!confirm("Nullstille alt?")) return;
        document.getElementById('wordInput').value = "";
        document.getElementById('gridOutput').innerHTML = "";
        document.getElementById('numberColumn').innerHTML = "";
        document.getElementById('wordListOutput').innerHTML = "";
        document.getElementById('placeholder-image').style.display = 'flex';
        document.getElementById('capture-area').style.display = 'none';
        document.querySelectorAll('input[type=checkbox]').forEach(el => el.checked = false);
        document.getElementById('temaVelger').value = 'tema-standard';
        document.getElementById('titleInput').value = ""; 
        document.getElementById('pageTitle').textContent = "Gitteroppgave";
        
        // Her legger du til de to linjene for rutestørrelse:
        document.getElementById('sizeVelger').value = '42px';
        oppdaterStorrelse();

        oppdaterTema();
        updateView();
    }

    function getPattern(word) {
        return word.toLowerCase().split('').map(c => vokaler.includes(c) ? 'V' : 'K');
    }

    function buildMaster(wordData) {
        let master = [...wordData[0].pattern];
        let placements = [{ start: 0, length: wordData[0].pattern.length }];
        for (let i = 1; i < wordData.length; i++) {
            let p = wordData[i].pattern;
            let minNewLength = Infinity;
            let finalShift = 0;
            for (let s = -p.length; s <= master.length; s++) {
                let possibleMatch = true;
                for (let j = 0; j < p.length; j++) {
                    let mIdx = s + j;
                    if (mIdx >= 0 && mIdx < master.length) {
                        if (master[mIdx] !== p[j]) { possibleMatch = false; break; }
                    }
                }
                if (possibleMatch) {
                    let currentStart = Math.min(0, s);
                    let currentEnd = Math.max(master.length, s + p.length);
                    let totalLen = currentEnd - currentStart;
                    if (totalLen < minNewLength) { minNewLength = totalLen; finalShift = s; }
                }
            }
            let newMaster = [];
            let offset = finalShift < 0 ? Math.abs(finalShift) : 0;
            if (finalShift < 0) {
                placements.forEach(pl => pl.start += offset);
                for(let k=0; k<offset; k++) newMaster.push(p[k]);
                master.forEach(m => newMaster.push(m));
                finalShift = 0;
            } else { newMaster = [...master]; }
            for (let j = 0; j < p.length; j++) newMaster[finalShift + j] = p[j];
            master = newMaster;
            placements.push({ start: finalShift, length: p.length });
        }
        return { master, placements };
    }

function generate() {
    const input = document.getElementById('wordInput').value.trim();
    if (input.length === 0) return;

    document.getElementById('placeholder-image').style.display = 'none';
    document.getElementById('capture-area').style.display = 'flex'; 

    const rawWords = input.split(/[\s,]+/).map(w => w.trim()).filter(w => w !== "");
    if (rawWords.length === 0) return;

    let wordData = rawWords.map(w => ({ word: w, pattern: getPattern(w) }));
    // wordData.sort((a, b) => b.word.length - a.word.length);

    const result = buildMaster(wordData);
    const masterPattern = result.master;
    const maxLength = masterPattern.length;

    const numCol = document.getElementById('numberColumn');
    numCol.innerHTML = "";

    let table = document.createElement('table');
    
    // LAG OVERKRIFTSRADEN (V/K)
    let headerRow = document.createElement('tr');
    headerRow.className = "header-row";
    
    let blankTd = document.createElement('td');
    blankTd.className = "num-cell-blank";
    headerRow.appendChild(blankTd);

    masterPattern.forEach(char => {
        let td = document.createElement('td');
        if (char === 'V') td.classList.add('is-vowel-cell');
        td.innerHTML = `<span class="${char === 'V' ? 'v-text' : 'k-text'}">${char}</span>`;
        headerRow.appendChild(td);
    });
    table.appendChild(headerRow);

    // LAG ORD-RADENE
    wordData.forEach((data, idx) => {
        let row = document.createElement('tr');
        
        let numTd = document.createElement('td');
        numTd.className = "num-cell";
        numTd.textContent = `${idx + 1}.`;
        row.appendChild(numTd);

        let letters = data.word.split('');
        let pos = result.placements[idx];
        let altStarts = [];
        for (let s = 0; s <= maxLength - data.pattern.length; s++) {
            let match = true;
            for (let j = 0; j < data.pattern.length; j++) {
                if (masterPattern[s+j] !== data.pattern[j]) { match = false; break; }
            }
            if (match && s !== pos.start) altStarts.push(s);
        }
        for (let i = 0; i < maxLength; i++) {
            let td = document.createElement('td');
            if (masterPattern[i] === 'V') td.classList.add('is-vowel-cell');
            if (i >= pos.start && i < pos.start + pos.length) {
                td.innerHTML = `<span class="cell-content">${letters[i - pos.start]}</span>`;
            } else { td.classList.add('inactive'); }
            if (altStarts.includes(i)) {
                td.classList.add('is-alt-start');
                td.innerHTML += `<span class="alt-indicator">ALT</span>`;
            }
            row.appendChild(td);
        }
        table.appendChild(row);
    });

    document.getElementById('gridOutput').innerHTML = "";
    document.getElementById('gridOutput').appendChild(table);

    // === NY DYNAMISK VOKALBOKS-LOGIKK SOM MATCHER CSS ===
    const boksContainer = document.getElementById('vowelBoxContainer');
    boksContainer.innerHTML = ""; // Nullstill gammelt innhold

let vowelBox = document.createElement('div');
vowelBox.id = 'vowelLineElement';
vowelBox.className = 'vowel-line'; // Matcher klassen i CSS

// Vi legger på litt styling direkte på boksen for bakgrunnsfarge og luft
vowelBox.style.backgroundColor = '#f8f9fa'; // Lys grå farge
vowelBox.style.padding = '8px 12px';        // Luft på innsiden av boksen
vowelBox.style.borderRadius = '6px';        // Myke, runde hjørner
vowelBox.style.marginTop = '10px';          // Litt avstand til elementet over
vowelBox.style.display = 'inline-block';    // Gjør at boksen ikke blir bredere enn innholdet

vowelBox.innerHTML = `
    <span style="font-weight: bold; margin-right: 12px; font-family: 'Segoe UI', sans-serif; font-size: 1.1rem; color: #2c3e50;">Vokaler:</span>
    <span id="vowelListContent" style="font-family: 'trykkskrift', sans-serif; font-size: 1.1rem; letter-spacing: 3px;">a e i o u y æ ø å</span>
`;
boksContainer.appendChild(vowelBox);

// === GENERER ORDLISTE ===
    let ordlisteHTML = "";
    
    // NÅ RIKTIG: Sjekker om bryteren FAKTISK er huket av (checked)
    const tommeFeltErMarkert = document.getElementById('toggleEnds').checked;

if (tommeFeltErMarkert) {
        const tilfeldigeOrd = [...rawWords];
        for (let i = tilfeldigeOrd.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tilfeldigeOrd[i], tilfeldigeOrd[j]] = [tilfeldigeOrd[j], tilfeldigeOrd[i]];
        }
        // Legg til en usynlig li-tag på slutten (.filler-space)
        ordlisteHTML = tilfeldigeOrd.map(w => `<li>${w}</li>`).join('') + '<li class="filler-space"></li>';
    } else {
        // Legg til en usynlig li-tag på slutten (.filler-space)
        ordlisteHTML = rawWords.map((w, idx) => `<li>${idx + 1}. ${w}</li>`).join('') + '<li class="filler-space"></li>';
    }

    document.getElementById('wordListOutput').innerHTML = `
        <div class="word-list-box">
            <h3>Ordliste</h3>
            <ul>${ordlisteHTML}</ul>
        </div>
    `;

// === FIX: Hent valgt tema fra menyen og legg det på body med en gang gitteret lages ===
    const temaSelect = document.getElementById('visueltTema') || document.querySelector('select[id*="tema"]'); 
    if (temaSelect) {
        // Fjern gamle theme-klasser først
        document.body.className = document.body.className.replace(/\btheme-\S+/g, '');
        document.body.className = document.body.className.replace(/\btema-\S+/g, '');
        
        // Legg til det temaet som faktisk er valgt i dropdown-menyen akkurat nå
        document.body.classList.add(temaSelect.value);
    }

    updateView();
// Vi øker fra 50 til 150 millisekunder for å gi nettleseren tid til å tegne linje 2
    setTimeout(sjekkOverlappMedBilde, 150);
}



    function downloadFullImage() {
        const element = document.getElementById('capture-area');
        if (!element || document.getElementById('gridOutput').innerHTML === "") {
            alert("Generer et gitter først!");
            return;
        }
        
        const originalTransform = element.style.transform;
        element.style.transform = "none";

        html2canvas(element, {
            backgroundColor: "#ffffff",
            scale: 2,
            onclone: (clonedDoc) => {
                const area = clonedDoc.getElementById('capture-area');
                area.style.display = "flex";
                area.style.boxShadow = "none";
                area.style.transform = "none";
            }
        }).then(canvas => {
            element.style.transform = originalTransform; 
            const link = document.createElement('a');
            link.download = 'gitter_oppgave.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function toggleMenu() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest('.menu-container')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
    
    updateView();
</script>
