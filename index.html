<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Gitter-generator</title>
    <link rel="icon" type="image/png" href="gitter_01.png">
    <link rel="apple-touch-icon" href="gitter_01.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    @font-face {
        font-family: 'Trykkskrift';
        src: url('trykkskrift.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }

    :root {
        --vokal-farge: #ffcccc; 
        --vokal-tekst: #e74c3c;
        --konsonant-tekst: #2c3e50;
        --konsonant-overskrift: #2980b9;
        --alt-match: #27ae60;
        --sidebar-bg: #243447; 
        --item-bg: #2c3e50;    
        --accent-green: #27ae60;
        --sidebar-text: #ffffff;
        --main-bg: #d1d8e0; 
        --cell-size: 42px; /* Standard (middels) størrelse */
    }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        display: flex; 
        height: 100vh; 
        background-color: var(--main-bg); 
        color: #333;
        overflow: hidden; 
    }

    /* SIDEBAR OG LOGO */
    .sidebar {
        width: 350px;
        background-color: var(--sidebar-bg);
        color: var(--sidebar-text);
        padding: 15px 15px 2px 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        z-index: 10;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }

    .sidebar h2 { margin: 0; flex-grow: 1; text-align: center; font-size: 1.1rem; text-transform: uppercase; }

    textarea { 
        width: 100%; 
        height: 95px; 
        padding: 10px; 
        border-radius: 6px; 
        border: none; 
        font-family: inherit; 
        font-size: 0.9rem; 
        box-sizing: border-box; 
        margin-bottom: 15px; 
        background-color: #ecf0f1;
        resize: none;
    }

    .sidebar-controls {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .action-btn:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
    }

    /* KONTROLLER */
    .control-item {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem;
    }

    .control-item select {
        padding: 4px;
        border-radius: 4px;
        border: none;
        background: #ecf0f1;
        font-family: inherit;
        font-size: 0.85rem;
        width: 60%;
        cursor: pointer;
    }

    .switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #27ae60; }
    input:checked + .slider:before { transform: translateX(20px); }

    .action-btn { 
        width: 100%; 
        padding: 10px; 
        border-radius: 8px; 
        border: none; 
        font-weight: 600; 
        cursor: pointer; 
        margin-bottom: 0; 
        color: white; 
        transition: 0.2s;
        box-sizing: border-box; 
        font-size: 0.85rem;
        display: flex;              
        align-items: center;   
        justify-content: center; 
    }

    .btn-generate { background-color: var(--accent-green); color: white; }
    .btn-row { display: flex; gap: 8px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; margin-top: auto; }

/* ==========================================================================
   HOVEDOMRÅDE: OPPDATERT FOR Å TILLATE SKROLLING PÅ MINDRE SKJERMER
   ========================================================================== */
.main-content { 
    flex-grow: 1; 
    overflow-y: auto !important; /* KORRIGERT: Tillater skrolling nedover */   
    display: flex; 
    justify-content: center; 
    align-items: flex-start; 
    padding: 20px; 
    box-sizing: border-box;
    min-height: 100vh;           /* KORRIGERT: Er minst skjermhøyden, men kan bli høyere */      
    background-color: var(--main-bg); 
}

#capture-area { 
    background: #ffffff !important; 
    width: 210mm;          
    height: 297mm;         
    padding: 15mm 18mm 20mm 18mm !important;
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column;
    align-items: center;  
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
    
    /* DENNE LINJEN ER LIVSVIKTIG FOR AT BILDENE SKAL VISES INNE PÅ ARKET: */
    position: relative !important; 
    
    flex-shrink: 0;
    margin: 30px auto 100px auto; /* KORRIGERT: Lagt til 100px bunnmarg så det blir luftig å skrolle helt ned */

    /* Skalerer ned arket nydelig på skjermen */
    transform: scale(0.75); 
    transform-origin: top center; 
}

    /* Fellesregel som posisjonerer temalinjen nøyaktig der den skrives ut */
    #capture-area::after {
        content: "";
        position: absolute;
        top: 10mm;    
        left: 10mm;   
        right: 10mm;  
        bottom: 10mm; 
        pointer-events: none; 
        z-index: 1;
        box-sizing: border-box;
    }

    .vowel-box {
        margin-top: 15px;
        padding: 10px 15px;
        border: 1px solid #7f8c8d;
        border-radius: 4px;
        background-color: #fcfcfc;
        font-family: 'trykkskrift', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1rem;
        color: #2c3e50;
        width: fit-content;
        max-width: 100%;
        box-sizing: border-box;
    }

    .vowel-title {
        font-weight: bold;
        margin-right: 8px;
    }

    .vowel-list {
        letter-spacing: 5px; 
        font-weight: 600;
        color: #e74c3c; 
    }

    .row-numbers { 
        display: none; 
    }

    .num-cell {
        font-family: 'Trykkskrift', Tahoma, Geneva, Verdana, sans-serif; 
        font-style: italic;
        font-size: 0.9rem;
        color: #7f8c8d;
        text-align: right !important;
        padding-right: 4px !important;
        border: none !important; 
        background: transparent !important;
        width: 18px !important;
        white-space: nowrap;
        height: calc(var(--cell-size) * 1.20) !important;
    }

    .header-row td.num-cell-blank, 
    .num-cell-blank {
        border: none !important;
        border-color: transparent !important;
        outline: none !important;
        background: transparent !important;
        background-color: transparent !important;
        width: 18px !important;
    }

    table { border-collapse: collapse; }
    td, .word-list-box, .vowel-line { font-family: 'Trykkskrift', sans-serif; }

    td { 
        border: 1px solid #000 !important; 
        width: var(--cell-size) !important; 
        height: calc(var(--cell-size) * 1.20) !important; 
        text-align: center; 
        font-size: calc(var(--cell-size) * 0.45); 
        position: relative;
        background-color: white !important;
    }

    body.show-vowel-bg .is-vowel-cell { background-color: var(--vokal-farge) !important; }
    body:not(.hide-ends-active) .inactive { background-color: #d1d1d1 !important; }
    body.hide-ends-active .inactive { background-color: white !important; }
    body.hide-ends-active.show-vowel-bg .is-vowel-cell { background-color: var(--vokal-farge) !important; }

    .header-row td { 
        border: 2px solid #000 !important; 
        height: calc(var(--cell-size) * 1.15) !important; 
    }
    .v-text { color: var(--vokal-tekst); }
    .k-text { color: var(--konsonant-tekst); }
    .header-row .k-text { color: var(--konsonant-overskrift); }

    body.uppercase-mode td, body.uppercase-mode .word-list-box, body.uppercase-mode .vowel-line { text-transform: uppercase; }
    .cell-content { display: none; }
    .show-fasit .cell-content { display: block; }

/* Krymper bokstavene inne i selve gitteret/tabellen */
body.uppercase-mode table {
    font-size: 0.85em !important;
}

/* Krymper bokstavene i ordlisten nederst på siden */
body.uppercase-mode .word-list-box ul li {
    font-size: 1.1rem !important; /* Går ned fra originalen på 1.8rem */
}

/* Valgfritt: Hvis du også vil krympe "Vokaler:"-linjen når den er i uppercase */
body.uppercase-mode .vowel-line #vowelListContent {
    font-size: 1.1rem !important; /* Går ned fra originalen på 2rem */
    letter-spacing: 8px !important; /* Justerer avstanden litt tettere */
    font-weight: bold !important; /* GJØR BOKSTAVENE FETE */
}

/* ORDLISTE */
.word-list-box { 
    padding: 2px; 
    margin-top: 30px; 
    background: white; 
    width: 100%; 
    box-sizing: border-box; 
    display: block; 
    min-width: 100%; 
    max-width: 100%; 
}

.word-list-box h3 { 
    margin: 0px 0 6px 0; 
    text-align: center; 
    font-size: 1.6rem;           
    padding-bottom: 0px; 
    
    /* NYE LINJER: Bruker temaets egne farger for tekst og strek */
    color: var(--theme-accent, #333);
    border-bottom: 2px solid var(--theme-accent, #333); 
    
    /* Linjene som holder teksten nede på streken */
    line-height: 0.8 !important;  
    display: inline-block;        
    width: 100%;                  
}

.word-list-box ul {  
    list-style: none; 
    padding: 0 !important; 
    margin: 0 !important;
    display: flex; 
    flex-wrap: wrap; 
    width: 100% !important; 
    justify-content: center; 
    gap: 6px 20px; /* Økt litt for bedre luft på skjermen */
}

/* 1. DEN GENERELLE LI-REGELEN (Kommer først) */
.word-list-box ul li { 
    padding: 2px 8px; 
    border: none; 
    white-space: nowrap; 
    font-family: 'Trykkskrift', sans-serif;
    font-size: 1.4rem;        /* SATT TIL 1.4rem */
    font-weight: 700;         /* ENDRET: Gjort ordene fete (700) */
    
    display: inline-flex;
    align-items: center;
    justify-content: center;
    
    flex: 1;
    max-width: fit-content;
}

/* 2. SPESIALREGELEN (Kommer rett etterpå) */
.word-list-box ul li.uten-nummer {
    flex-grow: 0 !important;
    margin-right: 30px !important;
    margin-bottom: 0 !important;
    display: inline-flex !important;
}

/* DEN MAGISKE LØSNINGEN FOR LINJE 2 */
.word-list-box ul li.filler-space {
    flex-grow: 999; 
    max-width: none !important;
    padding: 0;
    margin: 0;
    height: 0;
}

/* STYLING AV TALLET MED RING RUNDT */
.word-list-box ul li .ord-nummer {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    
    font-size: 13px !important;       /* ENDRET: Mindre tall (13px) */
    font-weight: 700 !important;
    font-family: Arial, sans-serif !important; 
    
    border: 2px solid #333 !important; 
    border-radius: 50% !important;
    
    width: 22px !important;           /* ENDRET: Mindre sirkel (22px) */
    height: 22px !important;          /* ENDRET: Mindre sirkel (22px) */
    margin-right: 8px !important; 
    
    box-sizing: border-box !important;
    flex-shrink: 0 !important; 
    transform: translateY(-1px) !important; /* Løfter sirkelen litt opp */
}

#gridOutput {
    margin-top: 10px; 
    display: flex;
    justify-content: center;
    width: 100%;
}

/* DEN MAGISKE LØSNINGEN FOR LINJE 2 */
.word-list-box ul li.filler-space {
    flex-grow: 999; 
    max-width: none !important;
    padding: 0;
    margin: 0;
    height: 0;
}

/* ULTRA-SPESIFIKK STYLING FOR Å TVINGE FREM SIRKELEN */
div.word-list-box ul li span.ord-nummer {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    
    font-size: 13px !important;       /* ENDRET: Tilpasset den nye lille størrelsen */
    font-weight: 700 !important;
    font-family: Arial, sans-serif !important;
    
    border: 2px solid #333 !important; 
    border-radius: 50% !important;
    background-color: transparent !important;
    
    width: 22px !important;           /* ENDRET: Tilpasset den nye lille størrelsen */
    height: 22px !important;          /* ENDRET: Tilpasset den nye lille størrelsen */
    min-width: 22px !important;       /* ENDRET: Tilpasset den nye lille størrelsen */
    min-height: 22px !important;      /* ENDRET: Tilpasset den nye lille størrelsen */
    
    margin-right: 10px !important; 
    padding: 0 !important;
    
    box-sizing: border-box !important;
    flex-shrink: 0 !important;
    transform: translateY(-1px) !important; /* Løfter sirkelen litt opp */
}

    .alt-indicator { display: none; position: absolute; top: 1px; right: 1px; color: var(--alt-match); font-size: 0.5rem; }
    .show-fasit .alt-indicator { display: block; }
    .show-fasit .is-alt-start { outline: 2px dashed var(--alt-match); outline-offset: -4px; }

    .vowel-line {
        visibility: hidden; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1.1rem;
        width: fit-content;
        margin: 0 auto; 
        padding: 4px 16px; 
        border: 1px solid #7f8c8d;
        border-radius: 6px;
        background-color: #fcfcfc;
        text-align: center;
    }

    body.show-vowel-line-active .vowel-line { 
        visibility: visible !important; 
    }

    #vowelListContent {
        letter-spacing: 2px;
        font-weight: 600;
        color: #e74c3c; 
    }

    /* HAMBURGER MENY */
    .menu-container { position: relative; margin-bottom: 0; margin-right: 15px; }
    .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; width: 20px; padding: 5px; }
    .hamburger span { display: block; width: 100%; height: 2px; background-color: white; border-radius: 1px; transition: 0.3s; }

    .dropdown-menu {
        display: none;
        position: absolute;
        top: 25px;
        left: 0;
        background-color: #2c3e50;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        width: 200px;
        z-index: 100;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
    }
    .dropdown-menu.show { display: block !important; }

    .menu-icon { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; object-fit: contain; border-radius: 3px; }
    .dropdown-menu a { display: block; color: white; padding: 12px 15px; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dropdown-menu a:hover { background-color: #34495e; }
    .menu-item-disabled { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }


/* ==========================================================================
   TEMA CONFIG: KLASSISKE RAMMER OG FARGEVARIABLER FOR SKJERM OG PRINT ::AFTER
   ========================================================================== */
body.theme-standard { --theme-accent: #2b6cb0; }
body.theme-standard .main-content { background-color: #d1d8e0; }
body.theme-standard #capture-area::after { border: 6px solid #2b6cb0 !important; }

body.theme-skog { --theme-accent: #2f855a; }
body.theme-skog .main-content { background-color: #dbebd7; }
body.theme-skog #capture-area::after { border: 6px solid #2f855a !important; }

body.theme-sol { --theme-accent: #dd6b20; }
body.theme-sol .main-content { background-color: #f7e6ce; }
body.theme-sol #capture-area::after { border: 6px solid #dd6b20 !important; }

body.theme-minimal { --theme-accent: #000000; }
body.theme-minimal .main-content { background-color: #f0f0f0; }
body.theme-minimal #capture-area::after { border: 0px solid #000000 !important; }

body.theme-host .main-content { background-color: #eedec8; }
body.theme-host #capture-area::after { border: 8px double #d35400 !important; }

body.theme-vinter .main-content { background-color: #d2e4f7; }
body.theme-vinter #capture-area::after { border: 6px dashed #3498db !important; }

body.theme-sommer .main-content { background-color: #f5f0ce; }

body.theme-rommet .main-content { background-color: #e5d4ed; }
body.theme-rommet #capture-area::after { border: 6px solid #9b59b6 !important; }

body.theme-fest .main-content { background-color: #fcdfed; }
body.theme-fest #capture-area::after { border: 6px dotted #e91e63 !important; }

body.theme-racerbil { --theme-accent: #e53e3e; }
body.theme-racerbil .main-content { background-color: #f7dcd9; }
body.theme-racerbil #capture-area::after { border: 8px double #e53e3e !important; }

body.theme-kryp { --theme-accent: #2f855a; }
body.theme-kryp .main-content { background-color: #deebd9; }
body.theme-kryp #capture-area::after { border: 6px solid #2f855a !important; }

body.theme-sommerfugl #capture-area::after { border: 6px dashed #b7791f !important; }

body.theme-halloween { --theme-accent: #333333; }
body.theme-halloween .main-content { background-color: #f0dfcc; }
body.theme-halloween #capture-area::after { border: 6px solid #333333 !important; }

body.theme-jul { --theme-accent: #c0392b; }
body.theme-jul .main-content { background-color: #fce3e1; }
body.theme-jul #capture-area::after { border: 6px dashed #c0392b !important; }

body.theme-dino { --theme-accent: #795548; }
body.theme-dino .main-content { background-color: #edeec9; }
body.theme-dino #capture-area::after { border: 6px solid #795548 !important; }

body.theme-pirat { --theme-accent: #34495e; }
body.theme-pirat .main-content { background-color: #dce1e6; }
body.theme-pirat #capture-area::after { border: 8px double #34495e !important; }

body.theme-sport { --theme-accent: #27ae60; }
body.theme-sport .main-content { background-color: #d2ebd9; }
body.theme-sport #capture-area::after { border: 6px solid #27ae60 !important; }

/* TEMA BILDER-INTEGRASJON PLASSERING */
.theme-image { 
    position: absolute; 
    width: 110px; 
    height: 110px; 
    background-size: contain; 
    background-repeat: no-repeat; 
    background-position: center; 
    opacity: 0.95; 
    z-index: 5; 
    display: none; 
}

#theme-img-1 { top: 14mm; left: 14mm; }       
#theme-img-2 { top: 14mm; right: 14mm; }

.theme-sommerfugl #theme-img-1, .theme-sommerfugl #theme-img-2, .theme-sommerfugl #theme-img-3,

.theme-host #theme-img-1, .theme-host #theme-img-2, .theme-host #theme-img-3,
.theme-jul #theme-img-1, .theme-jul #theme-img-2, .theme-jul #theme-img-3,
.theme-pirat #theme-img-1, .theme-pirat #theme-img-2, .theme-pirat #theme-img-3,
.theme-sommer #theme-img-1, .theme-sommer #theme-img-2, .theme-sommer #theme-img-3,
.theme-sport #theme-img-1, .theme-sport #theme-img-2, .theme-sport #theme-img-3,
.theme-rommet #theme-img-1, .theme-rommet #theme-img-2, .theme-rommet #theme-img-3,
.theme-vinter #theme-img-1, .theme-vinter #theme-img-2, .theme-vinter #theme-img-3 { display: block !important; }

.theme-dino #theme-img-1 { background-image: url('Bilder/dinosaur_01.png'); }

.theme-fest #theme-img-1 { background-image: url('Bilder/fest_01.png'); }

.theme-kryp #theme-img-2 { background-image: url('Bilder/kryp_02.png'); }

<script>
    const vokaler = "aeiouyæøå";

// KORRIGERT HJELPEFUNKSJON: Matchet nøyaktig mot dine HTML-verdier
    function hentFiltrerteOrd(visAlert = false) {
        const input = document.getElementById('wordInput').value.trim();
        let rawWords = input.split(/[\s,]+/).map(w => w.trim()).filter(w => w !== "");
        
        const sizeVelger = document.getElementById('sizeVelger');
        if (!sizeVelger || rawWords.length === 0) return rawWords;

        // 1. Store ruter (55px) -> Maks 10 ord
        if (sizeVelger.value === '55px') {
            if (rawWords.length > 10) {
                if (visAlert) alert("Ved store ruter er det kun plass til maksimalt 10 ord. De 10 første ordene dine blir brukt.");
                return rawWords.slice(0, 10);
            }
        } 
        // 2. Middels ruter (42px) -> Maks 12 ord
        else if (sizeVelger.value === '42px') {
            if (rawWords.length > 12) {
                if (visAlert) alert("Ved middels ruter er det kun plass til maksimalt 12 ord. De 12 første ordene dine blir brukt.");
                return rawWords.slice(0, 12);
            }
        } 
        // 3. Små ruter (34px / alle andre) -> Maks 15 ord
        else {
            if (rawWords.length > 15) {
                if (visAlert) alert("Det er kun plass til maksimalt 15 ord totalt. De 15 første ordene dine blir brukt.");
                return rawWords.slice(0, 15);
            }
        }

        return rawWords;
    }

    function updateView() {
        const body = document.body;
        if (!document.getElementById('toggleEnds').checked) body.classList.add('hide-ends-active');
        else body.classList.remove('hide-ends-active');
        if (document.getElementById('toggleVowels').checked) body.classList.add('show-vowel-bg');
        else body.classList.remove('show-vowel-bg');
        if (document.getElementById('toggleFasit').checked) body.classList.add('show-fasit');
        else body.classList.remove('show-fasit');
        if (document.getElementById('toggleCase').checked) body.classList.add('uppercase-mode');
        else body.classList.remove('uppercase-mode');
        
        if (document.getElementById('toggleVowelLine').checked) body.classList.add('show-vowel-line-active');
        else body.classList.remove('show-vowel-line-active');

        if (document.getElementById('gridOutput').innerHTML !== "") {
            // Henter ferdig kuttede ord (uten ny alert, da generate/storrelse-bytte håndterer det)
            let rawWords = hentFiltrerteOrd(false);

            let ordlisteHTML = "";
            const tommeFeltErMarkert = document.getElementById('toggleEnds').checked;

            if (tommeFeltErMarkert) {
                const tilfeldigeOrd = [...rawWords];
                for (let i = tilfeldigeOrd.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tilfeldigeOrd[i], tilfeldigeOrd[j]] = [tilfeldigeOrd[j], tilfeldigeOrd[i]];
                }
                ordlisteHTML = tilfeldigeOrd.map(w => `<li class="uten-nummer">${w}&nbsp;&nbsp;&nbsp;</li>`).join('') + '<li class="filler-space"></li>';
} else {
    // Sjekker om store bokstaver er aktivert for å krympe skriften på ordene
    const ordSkriftStorrelse = document.getElementById('toggleCase').checked ? '1.2rem' : '1.8rem';

    ordlisteHTML = rawWords.map((w, idx) => `
        <li style="display: inline-block !important; vertical-align: middle !important; font-size: ${ordSkriftStorrelse} !important; font-weight: 700 !important;">
            <span class="ord-nummer" style="
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                vertical-align: middle !important;
                font-size: 13px !important;
                font-weight: 700 !important;
                font-family: Arial, sans-serif !important;
                border: 2px solid #333 !important;
                border-radius: 50% !important;
                width: 22px !important;
                height: 22px !important;
                min-width: 22px !important;
                min-height: 22px !important;
                margin-right: 8px !important;
                box-sizing: border-box !important;
                flex-shrink: 0 !important;
                background-color: transparent !important;
                transform: translateY(-3.5px) !important;
            ">${idx + 1}</span>${w}
        </li>
    `).join('') + '<li class="filler-space"></li>';
}
            document.getElementById('wordListOutput').innerHTML = `
                <div class="word-list-box">
                    <h3>Ordliste</h3>
                    <ul>${ordlisteHTML}</ul>
                </div>
            `;
        }
    }

    function sjekkOverlappMedBilde() {
        const ordliste = document.querySelector('.word-list-box');
        const bilde3 = document.getElementById('theme-img-3');
        const captureArea = document.getElementById('capture-area');

        if (ordliste && bilde3 && captureArea) {
            const captureTop = captureArea.getBoundingClientRect().top;
            const ordlisteMål = ordliste.getBoundingClientRect();
            const bildeMål = bilde3.getBoundingClientRect();
            
            if (bildeMål.top === 0) return;

            const ordlisteBunnPosisjon = ordlisteMål.bottom - captureTop;
            const bildeToppPosisjon = bildeMål.top - captureTop;

            if (ordlisteBunnPosisjon >= (bildeToppPosisjon - 20)) {
                bilde3.style.setProperty('display', 'none', 'important');
                console.log("Kollisjon oppdaget! Skjuler bilde 3.");
            } else {
                bilde3.style.display = '';
            }
        }
    }

    function oppdaterTema() {
        const body = document.body;
        const ark = document.getElementById('capture-area');
        const temaVelger = document.getElementById('temaVelger');
        if (!ark || !temaVelger) return;

        const alleTemaer = [
            'theme-standard', 'theme-skog', 'theme-sol', 'theme-minimal', 
            'theme-host', 'theme-vinter', 'theme-sommer', 
            'theme-rommet', 'theme-fest', 'theme-racerbil', 'theme-kryp', 'theme-sommerfugl', 'theme-halloween', 
            'theme-jul', 'theme-dino', 'theme-pirat', 'theme-sport'
        ];
        
        body.classList.remove(...alleTemaer);
        body.classList.add(temaVelger.value);

        setTimeout(sjekkOverlappMedBilde, 50);
    }

    function oppdaterOverskrift() {
        const inputFelt = document.getElementById('titleInput');
        const arkTittel = document.getElementById('pageTitle');
        if (inputFelt.value.trim() === "") {
            arkTittel.textContent = "Gitteroppgave";
        } else {
            arkTittel.textContent = inputFelt.value;
        }
    }

    function oppdaterStorrelse() {
        const sizeVelger = document.getElementById('sizeVelger');
        if (sizeVelger) {
            // 1. Sett rutedimensjonen i CSS
            document.documentElement.style.setProperty('--cell-size', sizeVelger.value);
            
            const bilde3 = document.getElementById('theme-img-3');
            if (bilde3) bilde3.style.display = '';
            
            // 2. NYTT: Generer hele oppgaven på nytt for å tvinge frem riktig antall ord basert på ny størrelse
            if (document.getElementById('wordInput').value.trim() !== "") {
                generate(true); // Sender true for å vise alert om antall ord ble endret
            } else {
                setTimeout(sjekkOverlappMedBilde, 150);
            }
        }
    }

function resetForm() {
    if(!confirm("Nullstille alt?")) return;
    document.getElementById('wordInput').value = "";
    document.getElementById('gridOutput').innerHTML = "";
    document.getElementById('numberColumn').innerHTML = "";
    document.getElementById('wordListOutput').innerHTML = "";
    document.getElementById('placeholder-image').style.display = 'flex';
    document.getElementById('capture-area').style.display = 'none';
    document.querySelectorAll('input[type=checkbox]').forEach(el => el.checked = false);
    
    // KORRIGERT: Endret fra 'tema-standard' til 'theme-standard' (eller den nøyaktige valuematchingen i din HTML)
    const temaVelger = document.getElementById('temaVelger');
    if (temaVelger) {
        // Vi prøver 'theme-standard', hvis menyen din faktisk bruker 'tema-standard' i HTML, 
        // kan du la den stå, men sjekk opp mot oppdaterTema() listen.
        temaVelger.value = 'theme-standard'; 
    }
    
    document.getElementById('titleInput').value = ""; 
    document.getElementById('pageTitle').textContent = "Gitteroppgave";
    
    // Nullstiller størrelse til Middels ruter (42px)
    const sizeVelger = document.getElementById('sizeVelger');
    if (sizeVelger) {
        sizeVelger.value = '42px';
    }
    
    // Kjører oppdateringene i riktig rekkefølge
    oppdaterStorrelse();
    oppdaterTema();
    updateView();
}

    function getPattern(word) {
        return word.toLowerCase().split('').map(c => vokaler.includes(c) ? 'V' : 'K');
    }

    function buildMaster(wordData) {
        let master = [...wordData[0].pattern];
        let placements = [{ start: 0, length: wordData[0].pattern.length }];
        for (let i = 1; i < wordData.length; i++) {
            let p = wordData[i].pattern;
            let minNewLength = Infinity;
            let finalShift = 0;
            for (let s = -p.length; s <= master.length; s++) {
                let possibleMatch = true;
                for (let j = 0; j < p.length; j++) {
                    let mIdx = s + j;
                    if (mIdx >= 0 && mIdx < master.length) {
                        if (master[mIdx] !== p[j]) { possibleMatch = false; break; }
                    }
                }
                if (possibleMatch) {
                    let currentStart = Math.min(0, s);
                    let currentEnd = Math.max(master.length, s + p.length);
                    let totalLen = currentEnd - currentStart;
                    if (totalLen < minNewLength) { minNewLength = totalLen; finalShift = s; }
                }
            }
            let newMaster = [];
            let offset = finalShift < 0 ? Math.abs(finalShift) : 0;
            if (finalShift < 0) {
                placements.forEach(pl => pl.start += offset);
                for(let k=0; k<offset; k++) newMaster.push(p[k]);
                master.forEach(m => newMaster.push(m));
                finalShift = 0;
            } else { newMaster = [...master]; }
            for (let j = 0; j < p.length; j++) newMaster[finalShift + j] = p[j];
            master = newMaster;
            placements.push({ start: finalShift, length: p.length });
        }
        return { master, placements };
    }

    // Lagt til "visAlertParam" for å kontrollere om varsling skal skje
    function generate(visAlertParam = true) {

        document.getElementById('capture-area').style.display = 'flex'; 

        // Bruker den nye, sikre filtreringsfunksjonen
        let rawWords = hentFiltrerteOrd(visAlertParam);
        if (rawWords.length === 0) return;

        let wordData = rawWords.map(w => ({ word: w, pattern: getPattern(w) }));

        const result = buildMaster(wordData);
        const masterPattern = result.master;
        const maxLength = masterPattern.length;

        const numCol = document.getElementById('numberColumn');
        numCol.innerHTML = "";

        let table = document.createElement('table');
        
        let headerRow = document.createElement('tr');
        headerRow.className = "header-row";
        
        let blankTd = document.createElement('td');
        blankTd.className = "num-cell-blank";
        headerRow.appendChild(blankTd);

        masterPattern.forEach(char => {
            let td = document.createElement('td');
            if (char === 'V') td.classList.add('is-vowel-cell');
            td.innerHTML = `<span class="${char === 'V' ? 'v-text' : 'k-text'}">${char}</span>`;
            headerRow.appendChild(td);
        });
        table.appendChild(headerRow);

        wordData.forEach((data, idx) => {
            let row = document.createElement('tr');
            
            let numTd = document.createElement('td');
            numTd.className = "num-cell";
            numTd.textContent = `${idx + 1}.`;
            row.appendChild(numTd);

            let letters = data.word.split('');
            let pos = result.placements[idx];
            let altStarts = [];
            for (let s = 0; s <= maxLength - data.pattern.length; s++) {
                let match = true;
                for (let j = 0; j < data.pattern.length; j++) {
                    if (masterPattern[s+j] !== data.pattern[j]) { match = false; break; }
                }
                if (match && s !== pos.start) altStarts.push(s);
            }
            for (let i = 0; i < maxLength; i++) {
                let td = document.createElement('td');
                if (masterPattern[i] === 'V') td.classList.add('is-vowel-cell');
                if (i >= pos.start && i < pos.start + pos.length) {
                    td.innerHTML = `<span class="cell-content">${letters[i - pos.start]}</span>`;
                } else { td.classList.add('inactive'); }
                if (altStarts.includes(i)) {
                    td.classList.add('is-alt-start');
                    td.innerHTML += `<span class="alt-indicator">ALT</span>`;
                }
                row.appendChild(td);
            }
            table.appendChild(row);
        });

        document.getElementById('gridOutput').innerHTML = "";
        document.getElementById('gridOutput').appendChild(table);

        const boksContainer = document.getElementById('vowelBoxContainer');

        let vowelBox = document.createElement('div');

        vowelBox.style.display = 'inline-block';    
        vowelBox.style.lineHeight = '1';            

        vowelBox.innerHTML = `
            <span style="font-weight: bold; margin-right: 12px; font-family: 'Trykkskrift', sans-serif; font-size: 1.3rem; color: #2c3e50; line-height: 1;">Vokaler:</span>
            <span id="vowelListContent" style="font-family: 'Trykkskrift', sans-serif; font-size: 2rem; letter-spacing: 8px; line-height: 1;">a e i o u y æ ø å</span>
        `;
        boksContainer.appendChild(vowelBox);

        let ordlisteHTML = "";
        const tommeFeltErMarkert = document.getElementById('toggleEnds').checked;

        if (tommeFeltErMarkert) {
            const tilfeldigeOrd = [...rawWords];
            for (let i = tilfeldigeOrd.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tilfeldigeOrd[i], tilfeldigeOrd[j]] = [tilfeldigeOrd[j], tilfeldigeOrd[i]];
            }
            ordlisteHTML = tilfeldigeOrd.map(w => `<li class="uten-nummer">${w}&nbsp;&nbsp;&nbsp;</li>`).join('') + '<li class="filler-space"></li>';
} else {
    // Sjekker om store bokstaver er aktivert for å krympe skriften på ordene

            <span class="ord-nummer" style="
                display: inline-flex !important;

                justify-content: center !important;
                vertical-align: middle !important;

            ">${idx + 1}</span>${w}
        </li>
    `).join('') + '<li class="filler-space"></li>';
}

        document.getElementById('wordListOutput').innerHTML = `
            <div class="word-list-box">
                <h3>Ordliste</h3>

            </div>
        `;

        const temaSelect = document.getElementById('visueltTema') || document.querySelector('select[id*="tema"]'); 
        if (temaSelect) {
            document.body.className = document.body.className.replace(/\btheme-\S+/g, '');
            document.body.className = document.body.className.replace(/\btema-\S+/g, '');
            document.body.classList.add(temaSelect.value);
        }

        const bilde3 = document.getElementById('theme-img-3');
        if (bilde3) bilde3.style.display = ''; 

        updateView();
        
        setTimeout(sjekkOverlappMedBilde, 150);
    }

function downloadFullImage() {
    const element = document.getElementById('capture-area');
    if (!element || document.getElementById('gridOutput').innerHTML === "") {
        alert("Generer et gitter først!");
        return;
    }
    
    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("Feil: Fant ikke jsPDF-biblioteket!");
        return;
    }
    
    const originalTransform = element.style.transform;
    element.style.transform = "none";

    // Henter utskriften med en balansert skala (1.8 i stedet for 2.0)
    html2canvas(element, {
        backgroundColor: "#ffffff",
        scale: 1.9, 
        useCORS: true,          
        allowTaint: false,      
        logging: false,
        onclone: (clonedDoc) => {
            const area = clonedDoc.getElementById('capture-area');
            area.style.display = "flex";
            area.style.boxShadow = "none";
            area.style.transform = "none";
        }
    }).then(canvas => {
        element.style.transform = originalTransform; 

        try {
            // Komprimerer bildet til 85% kvalitet (reduserer filstørrelsen enormt)
            const imgData = canvas.toDataURL("image/jpeg", 0.95);

            const targetjsPDF = window.jspdf.jsPDF;
            
            // Aktiverer innebygd PDF-komprimering med { compress: true }
            const pdf = new targetjsPDF({
                orientation: 'p',
                unit: 'mm',
                format: 'a4',
                compress: true
            });
            
            const pdfBredde = pdf.internal.pageSize.getWidth();
            const pdfHøyde = pdf.internal.pageSize.getHeight();

            // Legger til det komprimerte bildet med 'FAST' for raskere/lettere prosessering
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfBredde, pdfHøyde, undefined, 'FAST');
            pdf.save('gitter_oppgave.pdf');
            
        } catch (feil) {
            console.error("PDF-generering feilet:", feil);
            alert("Det oppstod en feil under opprettelsen av PDF-en: " + feil.message);
        }
    }).catch(err => {
        element.style.transform = originalTransform;
        alert("Kunne ikke ta bilde av arket: " + err.message);
    });
}
    function toggleMenu() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest('.menu-container')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
    
    updateView();
</script>
